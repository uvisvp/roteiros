<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2E5065">
<title>Manipulação v2 — protótipo</title>
<style>
:root{
  --brand:#2F6B8F;--brand-d:#2E5065;--brand-w:#EDF4F9;--ink:#17242c;--muted:#61707a;
  --line:#d9e1e6;--line2:#c4d0d8;--canvas:#f3f5f7;--paper:#fff;--ok:#1f7a4b;--okbg:#eaf6ef;
  --bad:#a52b35;--badbg:#fff0f1;--na:#596b77;--nabg:#eef2f4;--warn:#9a641f;--warnbg:#fff7e8;
  --new:#1f6f5c;--newbg:#e6f5f0;--mov:#2F5F8F;--movbg:#eaf1fa;--r:14px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{min-width:320px;min-height:100vh;color:var(--ink);background:var(--canvas);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:84px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.proto{background:#fff4d6;border-bottom:1px solid #ecd9a3;color:#6b4f12;font-size:.8rem;padding:6px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.proto b{font-weight:800}
.proto button{border:1px solid #d9c07a;background:#fff;border-radius:8px;padding:3px 10px;font-size:.75rem}
header.top{position:sticky;top:0;z-index:20;background:var(--brand-d);color:#fff}
.hbar{display:flex;align-items:center;gap:10px;height:48px;padding:0 12px}
.hbar h1{flex:1;margin:0;text-align:center;font-size:1.02rem;letter-spacing:.02em;font-weight:800}
.hbar .ico{width:36px;height:36px;border:0;background:transparent;color:#fff;border-radius:10px;display:grid;place-items:center}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:#fff;padding:11px 6px;font-weight:700;color:#5d6b74;border-bottom:3px solid transparent}
.tabs button[aria-selected=true]{color:var(--brand-d);background:var(--brand-w);border-bottom-color:var(--brand-d)}
.chipbar{display:flex;gap:6px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);padding:7px 10px;scrollbar-width:thin}
.chipbar button{flex:0 0 auto;border:0;background:transparent;padding:8px 12px;border-radius:10px;font-weight:700;color:#3d4d57;font-size:.86rem;white-space:nowrap}
.chipbar button.on{background:var(--brand-d);color:#fff}
main{max-width:1100px;margin:0 auto;padding:14px 16px}
h2.sec{margin:4px 0 12px;font-size:1.05rem}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:14px;text-align:left;display:flex;gap:12px;align-items:flex-start;width:100%}
.card:hover{border-color:var(--brand)}
.card .num{flex:0 0 auto;min-width:38px;height:38px;border-radius:10px;background:var(--brand-d);color:#fff;font-weight:800;display:grid;place-items:center;font-size:.85rem;padding:0 6px}
.card .t{font-weight:800;line-height:1.25}
.card .s{color:var(--muted);font-size:.8rem;margin-top:2px}
.card .kick{font-size:.66rem;font-weight:800;letter-spacing:.08em;color:#7a8a94}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:.68rem;font-weight:800;background:#eef3f6;color:#526570;white-space:nowrap}
.badge.new{background:var(--newbg);color:var(--new)}.badge.mov{background:var(--movbg);color:var(--mov)}.badge.cond{background:#f3eefb;color:#5b3f8c}.badge.warn{background:var(--warnbg);color:var(--warn)}.badge.bad{background:var(--badbg);color:var(--bad)}.badge.ok{background:var(--okbg);color:var(--ok)}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.itemstrip{display:flex;gap:6px;overflow-x:auto;padding:8px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:10px}
.itemstrip button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 10px;font-weight:700;font-size:.8rem;white-space:nowrap}
.itemstrip button.on{background:var(--brand-d);border-color:var(--brand-d);color:#fff}
.panel{border:1px solid var(--line);border-radius:16px;background:#fff;padding:14px}
.panel-head{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.panel-head h3{margin:0;font-size:1.05rem}
.origin{font-size:.75rem;color:var(--muted)}
/* ——— pergunta: correção da quebra em tablet (título ocupa a largura toda, normas abaixo, botões em 3 colunas) ——— */
.q{border-top:1px solid var(--line);padding:14px 2px}
.q:first-child{border-top:0}
.q-title{font-weight:700;line-height:1.35;overflow-wrap:break-word}
.q-title .n{color:#7a8a94;font-weight:600;margin-right:4px}
.refs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.ref{border:1px solid #cfdbe3;background:#f3f7fa;border-radius:8px;padding:4px 8px;font-size:.74rem;color:#2d4654;text-align:left;max-width:100%;overflow-wrap:anywhere}
.answers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line2);border-radius:11px;overflow:hidden;max-width:520px}
.answers button{border:0;border-left:1px solid var(--line2);background:#fff;padding:10px 6px;min-height:44px;font-size:.86rem;white-space:normal;line-height:1.2}
.answers button:first-child{border-left:0}
.answers button.C{background:var(--okbg);color:var(--ok);font-weight:800}.answers button.NC{background:var(--badbg);color:var(--bad);font-weight:800}.answers button.NA{background:var(--nabg);color:var(--na);font-weight:800}
details.sub{margin-top:9px;border:1px solid #cfe3de;background:#f5fbf9;border-radius:10px}
details.sub>summary{padding:8px 11px;font-size:.8rem;font-weight:700;color:#255e55;cursor:pointer}
details.sub .in{padding:0 11px 11px}
details.orient{margin-top:8px;border:1px solid #dbe4ea;background:#f8fafb;border-radius:10px}
details.orient>summary{padding:7px 11px;font-size:.78rem;font-weight:700;color:#3f5967;cursor:pointer}
details.orient .in{padding:0 11px 10px;font-size:.84rem;color:#33444e;overflow-wrap:break-word}
textarea,input[type=text],input:not([type]),select{width:100%;border:1px solid var(--line2);border-radius:9px;padding:8px 10px;background:#fff;font-size:.88rem}
textarea{min-height:64px;resize:vertical}
.btnrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.btn{border:1px solid var(--line2);background:#fff;border-radius:9px;padding:7px 11px;font-size:.8rem;font-weight:700;color:#2d4654}
.btn.pri{background:var(--brand-d);border-color:var(--brand-d);color:#fff}
.note{border-radius:11px;padding:9px 12px;margin:10px 0;font-size:.83rem;border:1px solid}
.note.info{background:#f4f7f9;border-color:#dde5ea;color:#3d4f5a}
.note.mov{background:var(--movbg);border-color:#c9d9ee;color:#274b70}
.note.new{background:var(--newbg);border-color:#bfe3d7;color:#1c5a4a}
.note.warn{background:var(--warnbg);border-color:#efd9ad;color:#7a5116}
.note b{font-weight:800}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:10px 0}
.fgrid label{display:grid;gap:4px;font-size:.72rem;font-weight:700;color:#5f6e77}
.fgrid .s2{grid-column:span 2}.fgrid .s3{grid-column:1/-1}
.chipset{margin:12px 0}
.chipset h4{margin:0 0 6px;font-size:.84rem}
.chipset .help{font-size:.78rem;color:var(--muted);margin:0 0 7px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:7px 12px;font-size:.82rem;min-height:36px}
.chip.on{background:var(--brand-d);border-color:var(--brand-d);color:#fff}
details.box{border:1px solid var(--line);border-radius:12px;background:#fff;margin:12px 0}
details.box>summary{list-style:none;cursor:pointer;padding:11px 12px;font-weight:800;font-size:.9rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
details.box>summary::-webkit-details-marker{display:none}
details.box>summary::before{content:"▸";color:#7a8a94;transition:transform .15s}
details.box[open]>summary::before{transform:rotate(90deg)}
details.box.irr{border-color:#efc9cd}
details.box.irr>summary{color:#7c2530;background:#fff7f8;border-radius:12px}
details.box.eq{border-color:#cdd9e8}
details.box.eq>summary{background:#f5f8fc;border-radius:12px}
details.box .in{padding:4px 12px 12px}
.sub-hint{font-size:.76rem;color:var(--muted);margin:2px 0 8px}
.ncl-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid #f0f2f4}
.ncl-row:first-of-type{border-top:0}
.ncl-row .tx{font-size:.86rem;overflow-wrap:break-word}
.ncl-row .rf{display:block;font-size:.7rem;color:#6a7a84}
.tog{display:flex;gap:4px}
.tog button{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:5px 9px;font-size:.74rem;font-weight:700;min-width:44px}
.tog button.irr-on{background:var(--badbg);border-color:#e3a6ad;color:var(--bad)}
.tog button.na-on{background:var(--nabg);color:var(--na)}
.tog button.ok-on{background:var(--okbg);border-color:#a9d7bd;color:var(--ok)}
.tog button.par-on{background:var(--warnbg);border-color:#e7c98f;color:var(--warn)}
.eq-item{border:1px solid #e3e9ef;border-radius:10px;margin:7px 0}
.eq-item>summary{padding:9px 11px;cursor:pointer;font-weight:700;font-size:.86rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.eq-item .in{padding:0 11px 11px}
table.tb{width:100%;border-collapse:collapse;font-size:.8rem;margin:6px 0}
table.tb th,table.tb td{border:1px solid var(--line);padding:5px;text-align:left;vertical-align:top}
table.tb th{background:#f5f8fa;font-size:.72rem;color:#51616b}
table.tb td input{border:0;padding:4px;border-radius:0;min-width:70px}
.tbwrap{overflow-x:auto}
.cl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 14px;margin:6px 0}
.cl label{display:flex;gap:8px;align-items:flex-start;font-size:.85rem;padding:4px 0}
.cl input{margin-top:3px;width:18px;height:18px;flex:0 0 18px}
.counter{font-size:.72rem;font-weight:800;color:#6a7a84}
h5.mini{margin:12px 0 4px;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:#51616b}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.dock button{border:0;border-radius:10px;height:48px;background:#fff;color:var(--brand-d);font-size:1.2rem}
.dock .g{background:var(--brand-w)}.dock .nx{background:var(--brand-d);color:#fff}.dock .cl{color:var(--bad)}
/* Infrações */
.infra-note{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.84rem;margin-bottom:10px}
.infra-tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
.infra-tools input{flex:1 1 260px}
.inf{border-top:1px solid #e6ecf0;padding:12px 2px}
.inf:first-child{border-top:0}
.inf .d{font-weight:600}
.inf .old{font-size:.78rem;color:var(--bad);text-decoration:line-through;margin-top:4px}
.normbox{margin-top:8px;padding:9px 10px;border:1px solid #cad8e2;border-radius:10px;background:#f6f9fb;display:grid;gap:6px}
.normbox .lb{font-size:.66rem;font-weight:800;letter-spacing:.06em;color:#51616b;text-transform:uppercase}
.normbox .ref{background:#fff}
.inf .nt{font-size:.78rem;color:#6b4f12;background:#fff8e6;border-radius:8px;padding:5px 8px;margin-top:6px}
/* Modal */
.modal-back{position:fixed;inset:0;z-index:60;background:rgba(20,31,38,.5);display:grid;place-items:center;padding:14px}
.modal{background:#fff;border-radius:16px;max-width:720px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 25px 60px rgba(0,0,0,.25)}
.modal .mh{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);background:#f5f8fa;position:sticky;top:0}
.modal .mh h3{margin:0;font-size:1rem}
.modal .mb{padding:14px 16px;white-space:pre-wrap;font-size:.9rem;line-height:1.55}
/* Relatório */
.rep-legend{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.82rem;margin-bottom:12px}
.rep-legend span{display:inline-block;margin:2px 8px 2px 0}
.mark-c{background:#e7f6ed;border-bottom:2px solid #7cc39b}.mark-nc{background:#fdeef0;border-bottom:2px solid #e59aa3}.mark-sel{background:#eef1fd;border-bottom:2px solid #9aa9e5}
.paper{background:#fff;border:1px solid var(--line);border-radius:6px;max-width:820px;margin:0 auto;padding:40px 46px;font:14px/1.55 "Times New Roman",Georgia,serif;color:#111;box-shadow:0 8px 24px rgba(0,0,0,.06)}
.paper h1{font:700 15px/1.3 Arial,sans-serif;text-align:center;margin:0 0 2px;text-transform:uppercase}
.paper .org{text-align:center;font:12px Arial,sans-serif;color:#444;margin-bottom:18px}
.paper h2{font:700 13px/1.3 Arial,sans-serif;text-transform:uppercase;margin:20px 0 6px;border-bottom:1px solid #999;padding-bottom:3px}
.paper h3{font:700 12.5px/1.3 Arial,sans-serif;margin:12px 0 4px}
.paper p{margin:0 0 7px;text-align:justify}
.paper table{width:100%;border-collapse:collapse;font:12px/1.35 Arial,sans-serif;margin:6px 0 10px}
.paper th,.paper td{border:1px solid #888;padding:4px 5px;vertical-align:top;text-align:left}
.paper th{background:#eee}
.paper ol{margin:0 0 8px 18px;padding:0}
.paper li{margin-bottom:5px;text-align:justify}
.paper .cit{font:11.5px Arial,sans-serif;color:#333}
.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.photo{border:1px solid #999;height:150px;background:repeating-linear-gradient(45deg,#f1f1f1,#f1f1f1 10px,#e7e7e7 10px,#e7e7e7 20px);display:grid;place-items:center;color:#777;font:12px Arial,sans-serif}
.photos figcaption{font:11.5px Arial,sans-serif;margin-top:4px}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:40px;text-align:center;font:12px Arial,sans-serif}
.sign div{border-top:1px solid #333;padding-top:4px}
@media(max-width:640px){.grid{grid-template-columns:1fr}.cl{grid-template-columns:1fr}}
@media(max-width:620px){.fgrid{grid-template-columns:1fr}.fgrid .s2,.fgrid .s3{grid-column:auto}main{padding:12px 10px}.paper{padding:22px 16px}.ncl-row{grid-template-columns:1fr}.photos{grid-template-columns:1fr}}
@media print{.proto,header.top,.dock,.rep-legend,.no-print{display:none!important}body{background:#fff;padding:0}.paper{border:0;box-shadow:none;padding:0}}
</style>
</head>
<body>
<div class="proto" id="proto"><span><b>PROTÓTIPO</b> · Manipulação v2 — só navegação, textos e relatório. Nada é gravado, lido ou enviado.</span><button type="button" onclick="document.getElementById('proto').remove()">Ocultar</button></div>
<header class="top">
  <div class="hbar">
    <button class="ico" aria-label="Voltar ao núcleo" title="Voltar ao núcleo (inativo no protótipo)">←</button>
    <h1>FARMÁCIA COM MANIPULAÇÃO</h1>
    <span style="width:36px"></span>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="roteiro" aria-selected="true">Roteiro</button>
    <button role="tab" data-tab="infracoes" aria-selected="false">Infrações</button>
    <button role="tab" data-tab="relatorio" aria-selected="false">Relatório</button>
  </nav>
  <div class="chipbar" id="chipbar"></div>
</header>
<main>
  <section id="v-roteiro"></section>
  <section id="v-infracoes" hidden></section>
  <section id="v-relatorio" hidden></section>
</main>
<nav class="dock" id="dock">
  <button type="button" data-nav="prev" aria-label="Item anterior">←</button>
  <button type="button" class="cl" aria-label="Apagar dados (inativo)" title="Inativo no protótipo">⌫</button>
  <button type="button" class="g" data-nav="grid" aria-label="Voltar à grade">▦</button>
  <button type="button" class="nx" data-nav="next" aria-label="Próximo item">→</button>
</nav>
<div id="modal" class="modal-back" hidden><div class="modal" role="dialog" aria-modal="true"><div class="mh"><h3 id="mt"></h3><button class="btn" onclick="closeModal()">Fechar ×</button></div><div class="mb" id="mb"></div></div></div>

ina, ciclosporina, clozapina, digoxina, fenitoína, lítio, varfarina)?", "refs": ["RDC 67/2007 · Anexo II · 2.3"]}, {"t": "q", "id": "r158", "text": "A aquisição é precedida da qualificação de fornecedores, adquirindo-se apenas matérias-primas conformes às especificações do Anexo I?", "refs": ["RDC 67/2007 · Anexo II · 2.11.1"]}, {"t": "q", "id": "r159", "text": "A farmácia fixa identificação especial na rotulagem das SBIT no momento do recebimento, alertando tratar-se de substância de baixo índice terapêutico?", "refs": ["RDC 67/2007 · Anexo II · 2.11.2"]}, {"t": "q", "id": "r160", "text": "As SBIT são armazenadas em local distinto, de acesso restrito, sob guarda do farmacêutico, claramente identificadas e com cuidados especiais de conservação?", "refs": ["RDC 67/2007 · Anexo I · 4.2.6", "RDC 67/2007 · Anexo II · 2.11.3"]}, {"t": "q", "id": "r161", "text": "Na pesagem para manipulação há dupla checagem, uma realizada pelo farmacêutico, com registro?", "refs": ["RDC 67/2007 · Anexo II · 2.11.4"]}, {"t": "q", "id": "r162", "text": "No encapsulamento são utilizadas cápsulas do menor tamanho compatível com a dosagem?", "refs": ["RDC 67/2007 · Anexo II · 2.11.6"]}, {"t": "q", "id": "r163", "text": "A homogeneização emprega os mesmos excipientes e a mesma metodologia do produto objeto do perfil de dissolução?", "refs": ["RDC 67/2007 · Anexo II · 2.11.5"]}, {"t": "q", "id": "r164", "text": "A farmácia apresenta o perfil de dissolução para os produtos sólidos manipulados com cada SBIT?", "refs": ["RDC 67/2007 · Anexo II · 2.10"]}, {"t": "q", "id": "r165", "text": "Os excipientes são padronizados conforme a compatibilidade das formulações descrita em compêndios oficiais/farmacopeias/publicações indexadas?", "refs": ["RDC 67/2007 · Anexo II · 2.10.1"]}, {"t": "q", "id": "r166", "text": "A dispensação é acompanhada de bula simplificada com o padrão mínimo de informações ao paciente?", "refs": ["RDC 67/2007 · Anexo II · 2.6"]}, {"t": "q", "id": "r167", "text": "A dispensação oc
