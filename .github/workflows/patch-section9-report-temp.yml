name: Patch temporario relatorio Secao 9

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-section9-report-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrar narrativa completa da Secao 9
        shell: bash
        env:
          NEW_BLOCK_B64: 
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          p=Path('farmacia-manipulacao-report.js')
          s=p.read_text(encoding='utf-8')
          old="  function install(){var m={1:section1,2:section2,3:section3,4:section4,5:section5,6:section6};Object.keys(m).forEach(function(n){var s=FM.sections&&FM.sections['section'+n];if(s)s.getText=m[n];});FM.reportNarrators=m;}"
          new=base64.b64decode(os.environ['NEW_BLOCK_B64']).decode('utf-8')
          if old not in s:
              raise SystemExit('Bloco install esperado nao encontrado; abortando.')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          node --check farmacia-manipulacao-report.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add farmacia-manipulacao-report.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: complete section 9 narrative in manipulation report'
          git push
