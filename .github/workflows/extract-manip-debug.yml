name: Extrair módulo de manipulação

on:
  push:
    paths:
      - '.github/workflows/extract-manip-debug.yml'

permissions:
  contents: write

jobs:
  extrair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mapear integração do Index
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          raw=Path('Index.html').read_text(encoding='utf-8',errors='replace')
          lines=raw.splitlines()
          out=[]
          out.append(f'Total de linhas: {len(lines)}')
          out.append(f'Tamanho: {len(raw)}')
          out.append('')
          out.append('=== APP IDS EMPACOTADOS ===')
          for m in re.finditer(r'<script\s+type="text/plain"\s+id="([^"]+)"',raw,re.I):
              line=raw.count('\n',0,m.start())+1
              # comprimento do payload até </script>
              end=raw.find('</script>',m.end())
              size=max(0,end-m.end()) if end>=0 else -1
              out.append(f'{line:04d} | {m.group(1)} | payload≈{size} chars')
          out.append('')
          out.append('=== SCRIPT SRC ===')
          for m in re.finditer(r'<script[^>]+src=["\']([^"\']+)["\'][^>]*>',raw,re.I):
              out.append(f'{raw.count(chr(10),0,m.start())+1:04d} | {m.group(1)}')
          out.append('')
          out.append('=== LINHAS NORMAIS 610-940 ===')
          for i in range(609,min(len(lines),940)):
              line=lines[i]
              if len(line)<=5000:
                  out.append(f'{i+1:04d}: {line}')
              else:
                  mt=re.search(r'id="([^"]+)"',line)
                  out.append(f'{i+1:04d}: [linha longa {len(line)} chars] id={mt.group(1) if mt else "?"}')
          out.append('')
          out.append('=== CHAVES/ROTAS EM JS NÃO EMPACOTADO ===')
          # remove payloads para pesquisar somente o código de casca
          shell=re.sub(r'(<script\s+type="text/plain"[^>]*>).*?(</script>)',r'\1[PACKED]\2',raw,flags=re.I|re.S)
          shell_lines=shell.splitlines()
          pats=re.compile(r'(nucleus|nucleo|module|modulo|route|rota|medic|drog|manip|app--)',re.I)
          for i,line in enumerate(shell_lines,1):
              if pats.search(line): out.append(f'{i:04d}: {line[:3000]}')
          Path('INDEX_MAP.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit do mapa
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add INDEX_MAP.txt
          git diff --cached --quiet || git commit -m "chore: atualizar mapa de integração do Index"
          git push
