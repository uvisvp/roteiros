name: Ajustar relatório de manipulação

on:
  push:
    paths:
      - '.github/workflows/extract-manip-debug.yml'

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aprimorar narrativa das áreas e laboratórios
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('farmacia-manipulacao-report.js'); s=p.read_text(encoding='utf-8')

          pat=r"  function refrigeratorText\(r\)\{.*?\}\n\n  function section1"
          rep="  function refrigeratorText(r){r=r||{};if(r.presenca!=='SIM')return '';var a=[];if(t(r.identificacao))a.push('identificado como '+r.identificacao);if(t(r.finalidade||r.uso))a.push('destinado a '+t(r.finalidade||r.uso));if(t(r.faixa))a.push('faixa/parâmetro adotado '+r.faixa);var m=monitorText(r);if(m)a.push(m);if(t(r.instrumento))a.push('monitorado por '+r.instrumento+(t(r.instrumentoId)?' identificado como '+r.instrumentoId:''));if(t(r.certificado))a.push('certificado de calibração '+r.certificado+(t(r.calibracaoValidade||r.validade)?', válido até '+date(r.calibracaoValidade||r.validade):''));var checks=[];if(status(r,'checklist.organizacao')==='C')checks.push('organização interna');if(status(r,'checklist.segregacao')==='C')checks.push('segregação/identificação dos itens');if(status(r,'checklist.limpeza')==='C')checks.push('higienização');if(status(r,'checklist.monitoramento')==='C')checks.push('monitoramento de temperatura');if(status(r,'checklist.registros')==='C')checks.push('registros de monitoramento');if(status(r,'checklist.acaoCorretiva')==='C')checks.push('registro de ação corretiva quando necessário');if(checks.length)a.push('com '+sent(checks)+' conferidos');return 'O ambiente dispõe de refrigerador'+(a.length?', '+a.join(', '):'')+'.';}\n  function instrumentText(rows){var list=arr(rows).filter(function(x){return x&&(x.instrumento||x.identificacao||x.certificado);});if(!list.length)return '';return list.map(function(x){return [x.instrumento,x.identificacao&&('identificação '+x.identificacao),x.certificado&&('certificado '+x.certificado),x.validade&&('validade '+date(x.validade)),x.emitidoPor&&('emitido por '+x.emitidoPor)].filter(Boolean).join(' · ');}).join('; ');}\n  function recordsText(obj){obj=obj||{};var labels={ambiental:'monitoramento de temperatura e umidade',limpeza:'limpeza do ambiente/bancadas/equipamentos',balanca:'verificação diária das balanças',estoque:'entradas/saídas e situação de estoque',phmetro:'verificação/calibração do pHmetro',exaustor:'limpeza/manutenção do exaustor ou capela',purificador:'limpeza/manutenção do purificador e filtros',geladeira:'temperatura/limpeza do refrigerador',pressao:'pressão negativa/diferencial',filtros:'limpeza/troca de filtros',corretiva:'ações corretivas',estufa:'tempo/temperatura da estufa'};var ok=[];Object.keys(labels).forEach(function(k){if(obj[k]&&obj[k].status==='C')ok.push(labels[k]);});return sent(ok);}\n\n  function section1"
          s2,n=re.subn(pat,lambda m:rep,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('Falha ao corrigir refrigeratorText: '+str(n))
          s=s2

          pat=r"  function areaText\(name,x\)\{.*?\}\n  function section4\(\)\{.*?return L\.join\('\\n'\);\}\n"
          rep="  function areaText(name,x){x=x||{};if(x.naoSeAplica)return '';var L=[];if(x.descricao)push(L,name+': '+x.descricao+(x.equipamentos?' Equipamentos/mobiliário: '+x.equipamentos+'.':'').replace(/\\.\\./g,'.'));var direct={guarda:'guarda adequada das preparações',armario:'local apropriado para preparações prontas',afixados:'informações obrigatórias afixadas',validade:'controle de validade',promocao:'ausência de exposição promocional inadequada',controlados:'guarda compatível de controlados',termolabeis:'conservação de termolábeis',segregacao:'segregação de produtos não conformes/vencidos',restricao:'controle de acesso',genericos:'informação de genéricos',sngpc:'registros/escrituração aplicáveis',lavatorio:'estrutura de higiene das mãos',primeirosSocorros:'materiais de primeiros socorros/EPI',perfuro:'manejo de perfurocortantes',declaracao:'declarações/registros dos serviços',limpeza:'limpeza compatível',vacinacao:'situação vacinal dos aplicadores',cartaz:'informações dos serviços ao usuário',capacitacao:'capacitação/delegação profissional',registro:'registro da conferência e aprovação farmacêutica',confronto:'confronto entre OM, prescrição e rótulo',trocas:'organização para prevenir trocas'};var cf=onlyConforme(x,direct);if(cf.length)push(L,'Foram verificados: '+sent(cf)+'.');var m=monitorText(x.monitoramento);if(m)push(L,'Monitoramento em '+name.toLowerCase()+': '+m+'.');var ins=instrumentText((x.monitoramento||{}).instrumentos);if(ins)push(L,'Instrumentos: '+ins+'.');var rf=refrigeratorText(x.refrigerador);if(rf)push(L,rf);return L.join('\\n');}\n  function section4(){var s=FM.get('sections.s4',{}),L=['4. ÁREAS FÍSICAS'];push(L,areaText('Recepção e área de vendas/dispensação',s.recepcao));push(L,areaText('Dispensação de industrializados/drogaria',s.industrializados));push(L,areaText('Sala de prestação de serviços farmacêuticos',s.servicos));push(L,areaText('Área/local de conferência',s.conferencia));var d=s.dml||{},sa=s.sanitarios||{},pa=s.paramentacao||{};var dc=onlyConforme(d,{guarda:'guarda segregada e organizada dos materiais de limpeza/germicidas',regularizacao:'regularização dos produtos de limpeza'});if(dc.length)push(L,'DML: '+sent(dc)+'.');if(d.registros&&d.registros.notes)push(L,'DML — observações: '+d.registros.notes);var sc=onlyConforme(sa,{comunicacao:'ausência de comunicação direta inadequada com áreas técnicas',higiene:'insumos e estruturas para higiene',ralos:'ralos/tampas em condições adequadas',pertences:'guarda organizada de roupas e pertences'});if(sc.length)push(L,'Sanitários/vestiários: '+sent(sc)+'.');if(sa.registros&&sa.registros.notes)push(L,'Sanitários/vestiários — observações: '+sa.registros.notes);var pc=onlyConforme(pa,{fluxo:'barreira/fluxo compatível entre sujo e limpo',acesso:'acesso às áreas técnicas após paramentação',lavatorio:'lavatório e insumos de higiene compatíveis',epi:'EPI e vestimentas adequados'});if(pc.length)push(L,'Paramentação: '+sent(pc)+'.');if(pa.registros&&pa.registros.notes)push(L,'Paramentação — observações: '+pa.registros.notes);return L.join('\\n');}\n"
          s2,n=re.subn(pat,lambda m:rep,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('Falha ao aprimorar Seção 4: '+str(n))
          s=s2

          pat=r"  function labLine\(title,x\)\{.*?\}\n  function section5\(\)\{.*?return L\.join\('\\n'\);\}\n"
          rep="  function labLine(title,x){x=x||{};if(x.naoSeAplica)return '';var L=[];if(x.descricao||x.fluxo)push(L,title+': '+[x.descricao,x.fluxo].filter(Boolean).join(' '));var m=monitorText(x.monitoramento);if(m)push(L,'Monitoramento: '+m+'.');var ins=instrumentText((x.monitoramento||{}).instrumentos);if(ins)push(L,'Equipamentos/instrumentos: '+ins+'.');var regs=recordsText(x.registros);if(regs)push(L,'Planilhas/registros conferidos: '+regs+'.');var rf=refrigeratorText(x.refrigerador);if(rf)push(L,rf);return L.join('\\n');}\n  function section5(){var s=FM.get('sections.s5',{}),L=['5. LABORATÓRIOS'];[['Almoxarifado de matérias-primas e materiais de embalagem','almoxarifado'],['Controle de Qualidade','cq'],['Laboratório de Semissólidos e Líquidos','semissolidos'],['Laboratório de Sólidos','solidos'],['Área/local de lavagem','lavagem'],['Laboratório de Homeopatia','homeopatia']].forEach(function(x){push(L,labLine(x[0],s[x[1]]));});var semi=s.semissolidos||{},pur=semi.purificador||{};if(pur.metodo||pur.marca||pur.modelo)push(L,'Sistema purificador de água: '+[pur.metodo,pur.marca&&('marca '+pur.marca),pur.modelo&&('modelo '+pur.modelo),pur.ultimaTroca&&('última troca '+pur.ultimaTroca),pur.validade&&('próxima troca/validade '+pur.validade)].filter(Boolean).join(' · ')+'.');var sb=s.sbit||{};if(!sb.naoSeAplica){if(sb.substancias||sb.situacaoLicenca)push(L,'SBIT: '+[sb.substancias&&('substâncias '+sb.substancias),sb.situacaoLicenca&&('situação da licença '+sb.situacaoLicenca)].filter(Boolean).join('; ')+'.');var sr=refrigeratorText(sb.refrigerador);if(sr)push(L,sr);}return L.join('\\n');}\n"
          s2,n=re.subn(pat,lambda m:rep,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('Falha ao aprimorar Seção 5: '+str(n))
          s=s2

          pat=r"  function cabin\(title,x\)\{.*?\}\n  function section6\(\)\{.*?return L\.join\('\\n'\);\}\n"
          rep="  function cabin(title,x){x=x||{};if(x.naoSeAplica)return '';var L=[];if(x.descricao||x.identificacao||x.situacaoLicenca)push(L,title+': '+[x.descricao,x.identificacao&&('identificação '+x.identificacao),x.situacaoLicenca&&('situação da licença '+x.situacaoLicenca)].filter(Boolean).join('; ')+'.');var m=x.monitoramento||{},parts=[];if(t(m.pressure))parts.push('diferencial de pressão '+m.pressure+' Pa');var amb=monitorText(m);if(amb)parts.push(amb);if(t(m.manometer))parts.push('manômetro '+m.manometer+(t(m.manometerCert)?' · certificado '+m.manometerCert:'')+(t(m.manometerValid)?' · calibração válida até '+date(m.manometerValid):''));if(parts.length)push(L,'Monitoramento de '+title.toLowerCase()+': '+parts.join('; ')+'.');var ins=instrumentText(m.instrumentos);if(ins)push(L,'Instrumentos da cabine: '+ins+'.');var regs=recordsText(x.registros);if(regs)push(L,'Registros da cabine conferidos: '+regs+'.');var rf=refrigeratorText(x.refrigerador);if(rf)push(L,rf);return L.join('\\n');}\n  function section6(){var s=FM.get('sections.s6',{}),L=['6. LABORATÓRIOS DE SENSIBILIZANTES'];var g=s.geral||{},gc=onlyConforme(g,{salas:'salas/cabines dedicadas e antecâmaras quando exigidas',ar:'sistemas de ar/exaustão independentes quando exigidos',pesagem:'pesagem nas áreas dedicadas',limpeza:'procedimentos/registros de limpeza de balanças e bancadas',utensilios:'utensílios separados por classe',epi:'EPI e paramentação compatíveis',pop:'procedimentos para prevenção de contaminação cruzada/padronização de excipientes'});if(gc.length)push(L,'Requisitos gerais verificados: '+sent(gc)+'.');push(L,cabin('Cabine de Hormônios',s.hormonios));push(L,cabin('Cabine de Antibióticos',s.antibioticos));push(L,cabin('Cabine de Citostáticos',s.citostaticos));push(L,cabin('Cabine de Penicilínicos',s.penicilinicos));return L.join('\\n');}\n"
          s2,n=re.subn(pat,lambda m:rep,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('Falha ao aprimorar Seção 6: '+str(n))
          p.write_text(s2,encoding='utf-8')
          PY
          node --check farmacia-manipulacao-report.js
      - name: Commit do relatório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add farmacia-manipulacao-report.js
          git diff --cached --quiet || git commit -m "Aprimora narrativa de áreas, laboratórios e refrigeradores"
          git push
