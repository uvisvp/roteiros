name: Corrigir OCR de CRT e licença — manipulação

on:
  push:
    paths:
      - '.github/workflows/extract-manip-debug.yml'

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correção e testar
        run: |
          set -e
          python tools/tmp_patch_manip_ocr.py
          node --check farmacia-manipulacao-ocr.js
          node --check farmacia-manipulacao-section1.js
          node --check farmacia-manipulacao-report.js
          node tmp_test_manip_ocr.js
          rm -f tmp_test_manip_ocr.js
      - name: Commit das correções
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add farmacia-manipulacao-ocr.js farmacia-manipulacao-section1.js farmacia-manipulacao-report.js
          git diff --cached --quiet || git commit -m "Corrige horários do CRT e substitutos da licença em Manipulação"
          git push
