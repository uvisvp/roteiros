name: Auditar integração de manipulação

on:
  push:
    paths:
      - '.github/workflows/extract-manip-debug.yml'

permissions:
  contents: write

jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mapear index publicado e validar scripts
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import re, json
          raw=Path('index.html').read_text(encoding='utf-8',errors='replace')
          lines=raw.splitlines()
          out=[]
          out.append(f'index.html linhas={len(lines)} chars={len(raw)}')
          out.append('')
          out.append('=== APP IDS ===')
          for m in re.finditer(r'<script\s+type="text/plain"\s+id="([^"]+)"',raw,re.I):
              out.append(m.group(1))
          out.append('')
          out.append('=== SCRIPT SRC ===')
          for m in re.finditer(r'<script[^>]+src=["\']([^"\']+)["\'][^>]*>',raw,re.I):
              out.append(m.group(1))
          out.append('')
          out.append('=== OCORRÊNCIAS MANIPULAÇÃO / FARMÁCIA ===')
          for i,line in enumerate(lines,1):
              low=line.lower()
              if ('manipula' in low or 'farmácia' in low or 'farmacia-manipulacao' in low) and len(line)<12000:
                  out.append(f'{i:05d}: {line[:5000]}')
          out.append('')
          out.append('=== ROTAS / NÚCLEO MEDICAMENTOS ===')
          for i,line in enumerate(lines,1):
              if ('ROTEIROS' in line or 'Medicamentos' in line or 'data-nucleo' in line) and len(line)<20000:
                  out.append(f'{i:05d}: {line[:10000]}')
          out.append('')
          out.append('=== VERSÃO ===')
          m=re.search(r"APP_VERSAO\s*=\s*['\"]([^'\"]+)",raw)
          out.append(m.group(1) if m else 'não localizada')
          Path('MANIP_LIVE_AUDIT.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
          for f in farmacia-manipulacao-app.js farmacia-manipulacao-core.js farmacia-manipulacao-lookup.js farmacia-manipulacao-ocr.js farmacia-manipulacao-report.js farmacia-manipulacao-section{1,2,3,4,5,6,7,8,9}.js ifa-lookup-shared.js; do
            test -f "$f"
            node --check "$f"
          done
          python - <<'PY'
          from pathlib import Path
          sw=Path('sw.js').read_text(encoding='utf-8')
          required=['farmacia-manipulacao-app.js','farmacia-manipulacao-core.js','farmacia-manipulacao-lookup.js','farmacia-manipulacao-ocr.js','farmacia-manipulacao-report.js']+[f'farmacia-manipulacao-section{i}.js' for i in range(1,10)]+['ifa-lookup-shared.js']
          missing=[x for x in required if x not in sw]
          if missing: raise SystemExit('Ausentes do service worker: '+', '.join(missing))
          print('Service worker: arquivos de manipulação presentes.')
          PY
      - name: Commit da auditoria
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MANIP_LIVE_AUDIT.txt
          git diff --cached --quiet || git commit -m "chore: registrar auditoria da integração de manipulação"
          git push
