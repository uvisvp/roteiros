name: Validar e publicar Farmácia de Manipulação 20260912-2

on:
  push:
    paths:
      - '.github/workflows/extract-manip-debug.yml'

permissions:
  contents: write

jobs:
  validar-publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar estrutura do módulo
        run: |
          set -e
          for f in farmacia-manipulacao-app.js farmacia-manipulacao-core.js farmacia-manipulacao-lookup.js farmacia-manipulacao-ocr.js farmacia-manipulacao-report.js farmacia-manipulacao-section1.js farmacia-manipulacao-section2.js farmacia-manipulacao-section3.js farmacia-manipulacao-section4.js farmacia-manipulacao-section5.js farmacia-manipulacao-section6.js farmacia-manipulacao-section7.js farmacia-manipulacao-section8.js farmacia-manipulacao-section9.js ifa-lookup-shared.js; do
            test -s "$f"
            node --check "$f"
          done
          python - <<'PY'
          from pathlib import Path
          checks={
            'farmacia-manipulacao-core.js':['automaticSanitaryJudgment: false','autoHideSectionsFromOtherAnswers: false','crtHasValidityField: false',"sensitizerPressureOperationalReference: '-5 a -120 Pa'",'createRefrigeratorCard'],
            'farmacia-manipulacao-section1.js':["BASE + '.licenca.substitutos'","BASE + '.crt.substitutos'",'A CRT não possui campo de validade'],
            'farmacia-manipulacao-section3.js':['PCMSO','PGR','Adicionar ASO','Treinamentos'],
            'farmacia-manipulacao-section4.js':['createRefrigeratorCard','Selecionar fórmulas para rastreabilidade'],
            'farmacia-manipulacao-section5.js':['Almoxarifado','Controle de Qualidade','Homeopatia','SBIT'],
            'farmacia-manipulacao-section6.js':['Cabine de Hormônios','Cabine de Antibióticos','Cabine de Citostáticos','Cabine de Penicilínicos','sensitizerPressureOperationalReference'],
            'farmacia-manipulacao-section7.js':['createCopyButton','Qualificação e Manutenção do Sistema de Exaustão'],
            'farmacia-manipulacao-section8.js':['createCopyButton','Água Purificada','Água Potável','eventKey'],
            'farmacia-manipulacao-section9.js':['createCopyButton','DANFE de aquisição','Certificado do fabricante','Consultar IFA','estoqueControlados'],
            'farmacia-manipulacao-ocr.js':['function parseCrt(base)','function parseLicense(base)','rtHorario','reviewedPeople(fields.substitutos)','parsers:{parseCrt:parseCrt,parseLicense:parseLicense}'],
            'farmacia-manipulacao-report.js':['3. PESSOAL, SAÚDE OCUPACIONAL E TREINAMENTO','7. DOCUMENTOS APRESENTADOS','Responsáveis técnicos substitutos constantes da licença','checklist.organizacao','manômetro'],
            'farmacia-manipulacao-lookup.js':['IFA — Insumo Farmacêutico Ativo','processo_anvisa','Não equivale a ausência de regularização']
          }
          for fn,needles in checks.items():
            text=Path(fn).read_text(encoding='utf-8')
            missing=[x for x in needles if x not in text]
            if missing: raise SystemExit(f'{fn}: ausentes {missing}')
          index=Path('index.html').read_text(encoding='utf-8')
          if 'Farmácia de manipulação, drogaria e distribuidora/transportadora.' not in index: raise SystemExit('Card Medicamentos desatualizado.')
          sw=Path('sw.js').read_text(encoding='utf-8')
          required=['farmacia-manipulacao-app.js','farmacia-manipulacao-core.js','farmacia-manipulacao-lookup.js','farmacia-manipulacao-ocr.js','farmacia-manipulacao-report.js']+[f'farmacia-manipulacao-section{i}.js' for i in range(1,10)]+['ifa-lookup-shared.js']
          missing=[x for x in required if x not in sw]
          if missing: raise SystemExit('Ausentes do cache essencial: '+', '.join(missing))
          print('Validação estrutural: OK')
          PY
      - name: Atualizar versão e limpar temporários
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import json,re
          version='20260912-2'
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s,n=re.subn(r"(const\s+APP_VERSAO\s*=\s*['\"])[^'\"]+(['\"])",lambda m:m.group(1)+version+m.group(2),s,count=1)
          if n!=1: raise SystemExit('APP_VERSAO não localizado.')
          p.write_text(s,encoding='utf-8')
          p=Path('sw.js'); s=p.read_text(encoding='utf-8')
          s,n=re.subn(r"(const\s+VERSAO\s*=\s*['\"])[^'\"]+(['\"])",lambda m:m.group(1)+version+m.group(2),s,count=1)
          if n!=1: raise SystemExit('VERSAO do service worker não localizada.')
          p.write_text(s,encoding='utf-8')
          p=Path('versao.json'); data=json.loads(p.read_text(encoding='utf-8'))
          data['versao']=version; data['correcoes']=7
          data['notas']='Farmácia de Manipulação: relatório narrativo revisado, refrigeradores e equipamentos consolidados, CRT sem validade com horários individuais de RT/substitutos, múltiplos substitutos da licença preservados, OCR sujeito à conferência e consulta IFA mantida pelo motor compartilhado.'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          for name in ['MANIP_DEBUG.txt','INDEX_STRUCTURE.txt','INDEX_MAP.txt','MANIP_LIVE_AUDIT.txt','tools/tmp_patch_manip_ocr.py']:
            Path(name).unlink(missing_ok=True)
          Path('.github/workflows/extract-manip-debug.yml').unlink(missing_ok=True)
          if version not in Path('index.html').read_text(encoding='utf-8') or version not in Path('sw.js').read_text(encoding='utf-8'): raise SystemExit('Versão não sincronizada.')
          print('Versão preparada:',version)
          PY
      - name: Commit final
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Publica Farmácia de Manipulação 20260912-2"
          git push
