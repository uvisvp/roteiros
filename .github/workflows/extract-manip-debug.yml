name: Extrair módulo de manipulação

on:
  push:
    paths:
      - '.github/workflows/extract-manip-debug.yml'

permissions:
  contents: write

jobs:
  extrair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mapear estrutura do Index
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('Index.html')
          raw = p.read_text(encoding='utf-8', errors='replace')
          lines = raw.splitlines()
          out=[]
          out.append(f'Total de linhas: {len(lines)}')
          out.append(f'Tamanho em caracteres: {len(raw)}')
          out.append('')
          out.append('=== LINHAS LONGAS ===')
          for i,line in enumerate(lines,1):
              if len(line) > 5000:
                  out.append(f'Linha {i}: {len(line)} caracteres')
                  out.append('INÍCIO: '+line[:500])
                  out.append('FIM: '+line[-500:])
                  out.append('')
          out.append('=== SCRIPTS / REFERÊNCIAS EXTERNAS ===')
          for i,line in enumerate(lines,1):
              if '<script' in line.lower() or 'script src' in line.lower() or '.js' in line.lower():
                  out.append(f'{i:04d}: {line[:1800]}')
          out.append('')
          out.append('=== TERMOS / ATRIBUTOS DE NAVEGAÇÃO ===')
          pats=['nucleus-card','data-nucleus','data-module','openModule','openNucleus','farmacia','manip','medicamentos','drogaria']
          for i,line in enumerate(lines,1):
              low=line.lower()
              if any(x.lower() in low for x in pats):
                  out.append(f'{i:04d}: {line[:2500]}')
          out.append('')
          out.append('=== ÚLTIMAS 120 LINHAS (TRUNCADAS) ===')
          for i in range(max(0,len(lines)-120),len(lines)):
              out.append(f'{i+1:04d}: {lines[i][:2500]}')
          Path('INDEX_STRUCTURE.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit do diagnóstico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add INDEX_STRUCTURE.txt
          git diff --cached --quiet || git commit -m "chore: atualizar diagnóstico técnico do Index"
          git push
