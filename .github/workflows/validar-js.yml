name: Validar módulos JavaScript

# Valida o código que o app de fato carrega e as regras do app (o módulo antigo de Manipulação, de 9 seções,
# foi substituído pelo v2 empacotado no index.html e saiu do repositório em 18/10/2026).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxe dos scripts do site
        run: |
          set -e
          for arquivo in *.js campo/*.js roteiro-simples/*.js; do
            node --check "$arquivo"
          done
      - name: Regras do app (Lei 13.725, Para saber mais, cache do PWA e versão)
        run: node scripts/test-regras.cjs
      - name: Drogaria, consultas por processo, citações e atualização do PWA
        run: |
          set -e
          node scripts/test-drogaria.cjs
          node scripts/test-processos.cjs
          node scripts/test-legis-v12-reference-utils.cjs
          node scripts/test-pwa-update.cjs
      - name: Blocos protegidos do PWA (banco normativo e citações)
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          elif [ -n "${{ github.event.before }}" ] && ! echo "${{ github.event.before }}" | grep -qE '^0+$'; then
            BASE="${{ github.event.before }}"
          else
            BASE="HEAD"
          fi
          PWA_BASE="$BASE" node scripts/test-pwa-scope.cjs
