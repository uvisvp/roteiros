name: Integrar IFA em Farmácia de Manipulação

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrar-ifa-manipulacao-temp.yml'

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrar motor compartilhado no fluxo 9.5
        run: python scripts/integrar_ifa_manipulacao_temp.py
      - name: Validar sintaxe e integração
        run: |
          node --check ifa-lookup-shared.js
          node --check farmacia-manipulacao-lookup.js
          node --check farmacia-manipulacao-section9.js
          grep -q "openIfaLookup" farmacia-manipulacao-lookup.js
          grep -q "UvisIfaLookup" farmacia-manipulacao-lookup.js
          grep -q "Processo Anvisa (IFA)" farmacia-manipulacao-section9.js
      - name: Salvar integração
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add farmacia-manipulacao-lookup.js farmacia-manipulacao-section9.js
          git commit -m 'Integra consulta IFA no confronto de estoque'
          git pull --rebase origin main
          git push origin HEAD:main
