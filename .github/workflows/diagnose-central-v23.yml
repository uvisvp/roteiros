name: Diagnose central consultas v23
on:
  push:
    branches: [fix-consulta-cosmeticos-v22]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-consulta-cosmeticos-v22
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Decode and inspect real central flow
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const h=fs.readFileSync('index.html','utf8');
          const c=h.match(/<script id="lz-core">([\s\S]*?)<\/script>/); if(!c) throw Error('lz'); vm.runInThisContext(c[1]);
          const m=h.match(/<[^>]+id=["']app--central-consultas["'][^>]*>([\s\S]*?)<\/[^>]+>/); if(!m) throw Error('central');
          const s=LZString.decompressFromBase64(m[1].trim());
          console.log('SIZE',s.length);
          const terms=['processo','buscar','consultar','cosmet','medicamentos','saneantes','dispositivos','base-vigilancia','resultado'];
          for(const term of terms){ console.log('\n===== '+term+' ====='); let p=0,n=0; while((p=s.toLowerCase().indexOf(term,p))>=0 && n++<30){console.log('POS',p);console.log(s.slice(Math.max(0,p-900),Math.min(s.length,p+1800)));p+=term.length;} }
          NODE
