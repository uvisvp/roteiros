name: Target v17 Alimentos lookup
on:
  push:
    branches: [publish-v17-staging]
    paths: ['.github/workflows/v17-target.yml']
permissions:
  contents: write
jobs:
  target:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: publish-v17-staging}
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p .v17target
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html').read_text()
          m=re.search(r'<script[^>]+id="lz-core"[^>]*>(.*?)</script>',p,re.S)
          Path('.v17target/lz.js').write_text(m.group(1)+'\nmodule.exports=LZString;\n')
          blocks=dict(re.findall(r'<script type="text/plain" id="([^"]+)">(.*?)</script>',p,re.S))
          b=blocks['app--alimentos-integrado']
          Path('.v17target/in.b64').write_text(b)
          PY
          cat > .v17target/decode.js <<'JS'
          const fs=require('fs'),LZ=require('./lz.js');
          let s=LZ.decompressFromBase64(fs.readFileSync('.v17target/in.b64','utf8').trim());
          if(s==null) throw Error('decompress'); fs.writeFileSync('.v17target/src.html',s);
          JS
          node .v17target/decode.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('.v17target/src.html').read_text(errors='replace')
          out=[]
          for marker in ['Situação do documento','Vencimento do registro','APRESENTAÇÃO(ÕES)','1 APRESENTAÇÃO']:
              for m in re.finditer(re.escape(marker),s,re.I):
                  a=max(0,m.start()-4500); b=min(len(s),m.end()+6500)
                  out.append(f'\n===== MARKER {marker} @ {m.start()} =====\n{s[a:b]}\n')
                  break
          styles=re.findall(r'<style[^>]*>(.*?)</style>',s,re.S|re.I)
          out.append('\n===== ALL STYLE BLOCKS =====\n'+'\n\n'.join(styles))
          Path('_v17-alimentos-target.txt').write_text(''.join(out))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _v17-alimentos-target.txt
          git commit -m 'Add targeted Alimentos mobile diagnostic'
          git push origin HEAD:publish-v17-staging
