name: Diagnosticar Central de Consultas

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnosticar-central-consultas.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair módulo da Central de Consultas
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          out=[]
          for nome in ['index.html','Index.html']:
              p=Path(nome)
              if not p.exists():
                  continue
              txt=p.read_text(encoding='utf-8', errors='replace')
              out.append(f'===== {nome} | {len(txt)} caracteres =====')
              termo='central-consultas'
              poss=[m.start() for m in re.finditer(re.escape(termo), txt, flags=re.I)]
              out.append(f'ocorrencias {termo}: {poss}')
              for n,i in enumerate(poss):
                  ini=max(0,i-30000); fim=min(len(txt),i+50000)
                  out.append(f'\n===== OCORRENCIA {n+1} pos={i} janela={ini}:{fim} =====\n')
                  out.append(txt[ini:fim])
              # Índice de possíveis recipientes/registradores de módulos próximos ao termo.
              for pat in [r'ROTEIROS\s*=', r'APPS\s*=', r'MODULOS\s*=', r'const\s+APPS', r'var\s+APPS', r'abrirApp\s*\(', r'data-app', r'type=["\']text/plain["\']']:
                  hits=[m.start() for m in re.finditer(pat, txt, flags=re.I)]
                  out.append(f'PATTERN {pat}: {hits[:30]}')
          Path('diagnostico-central-modulo.txt').write_text('\n'.join(out),encoding='utf-8')
          print('\n'.join(out[:12]))
          PY
      - name: Guardar diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-central-modulo
          path: diagnostico-central-modulo.txt
          if-no-files-found: error
