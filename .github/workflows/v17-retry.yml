name: Retry v17 Alimentos mobile fix
on:
  push:
    branches: [publish-v17-staging]
    paths: ['.github/workflows/v17-retry.yml']
permissions:
  contents: write
jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish-v17-staging
          fetch-depth: 0
      - name: Run validated patch with clean workspace
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/v17-fix.yml').read_text().splitlines()
          start=next(i for i,x in enumerate(s) if x.strip()=='run: |')+1
          body=[]
          for x in s[start:]:
              if x.startswith('          '): body.append(x[10:])
              elif x.strip(): break
          sh='\n'.join(body)+'\n'
          sh=sh.replace('rm -rf .github _v17-probe.txt _v17-diag.txt _v17-alimentos-target.txt .v17diag .v17target','rm -rf .github _v17-probe.txt _v17-diag.txt _v17-alimentos-target.txt .v17diag .v17target .v17fix')
          Path('/tmp/v17-run.sh').write_text(sh)
          PY
          bash /tmp/v17-run.sh
