name: Build v17 Alimentos mobile fix
on:
  push:
    branches: [publish-v17-staging]
    paths: ['.github/workflows/v17-fix.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish-v17-staging
          fetch-depth: 0
      - name: Patch only Alimentos lookup and version markers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .v17fix
          cp index.html .v17fix/index.before.html
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html').read_text()
          m=re.search(r'<script[^>]+id="lz-core"[^>]*>(.*?)</script>',p,re.S)
          if not m: raise SystemExit('lz-core missing')
          Path('.v17fix/lz.js').write_text(m.group(1)+'\nmodule.exports=LZString;\n')
          bm=re.search(r'<script type="text/plain" id="app--alimentos-integrado">(.*?)</script>',p,re.S)
          if not bm: raise SystemExit('Alimentos packed block missing')
          Path('.v17fix/alimentos.b64').write_text(bm.group(1))
          PY
          cat > .v17fix/codec.js <<'JS'
          const fs=require('fs'),LZ=require('./lz.js');
          const [,,mode,input,output]=process.argv;
          if(mode==='d'){
            const v=LZ.decompressFromBase64(fs.readFileSync(input,'utf8').trim());
            if(v==null) throw Error('decompress failed'); fs.writeFileSync(output,v);
          } else if(mode==='c') {
            fs.writeFileSync(output,LZ.compressToBase64(fs.readFileSync(input,'utf8')));
          } else throw Error('mode');
          JS
          node .v17fix/codec.js d .v17fix/alimentos.b64 .v17fix/alimentos.html
          python - <<'PY'
          from pathlib import Path
          p=Path('.v17fix/alimentos.html')
          s=p.read_text()
          old='''dl.fichas{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13.5px}\ndl.fichas dt{font-weight:600;color:var(--muted);white-space:nowrap}\ndl.fichas dd{margin:0}'''
          new='''dl.fichas{margin:0;display:grid;grid-template-columns:minmax(0,max-content) minmax(0,1fr);gap:5px 12px;font-size:13.5px;max-width:100%}\ndl.fichas dt{font-weight:600;color:var(--muted);white-space:normal;overflow-wrap:anywhere;min-width:0}\ndl.fichas dd{margin:0;min-width:0;max-width:100%;overflow-wrap:anywhere;word-break:break-word}\n@media(max-width:600px){\n  dl.fichas{grid-template-columns:minmax(0,1fr);gap:2px 0;width:100%;max-width:100%}\n  dl.fichas dt{margin-top:7px;white-space:normal;line-height:1.3}\n  dl.fichas dt:first-child{margin-top:0}\n  dl.fichas dd{margin:0 0 4px;line-height:1.4}\n  .bloco{max-width:100%;min-width:0}\n  .ad>summary,.ad .nome{min-width:0;max-width:100%}\n  .ad .nome{overflow-wrap:anywhere}\n}'''
          if old not in s: raise SystemExit('expected fichas CSS not found exactly')
          if s.count(old)!=1: raise SystemExit('expected one fichas CSS occurrence')
          s=s.replace(old,new)
          p.write_text(s)
          PY
          node .v17fix/codec.js c .v17fix/alimentos.html .v17fix/alimentos.new.b64
          python - <<'PY'
          from pathlib import Path
          import re,json
          p=Path('index.html')
          s=p.read_text()
          newb=Path('.v17fix/alimentos.new.b64').read_text().strip()
          pat=r'(<script type="text/plain" id="app--alimentos-integrado">)(.*?)(</script>)'
          s,n=re.subn(pat,lambda m:m.group(1)+newb+m.group(3),s,count=1,flags=re.S)
          if n!=1: raise SystemExit('failed replacing target block')
          if '20260907-16' not in s: raise SystemExit('v16 marker missing from index')
          s=s.replace('20260907-16','20260907-17')
          p.write_text(s)
          sw=Path('sw.js').read_text()
          if '20260907-16' not in sw: raise SystemExit('v16 marker missing from sw')
          Path('sw.js').write_text(sw.replace('20260907-16','20260907-17'))
          vp=Path('versao.json'); d=json.loads(vp.read_text())
          d['versao']='20260907-17'
          if isinstance(d.get('correcoes'),int): d['correcoes']+=1
          d['notas']='Correção mobile em Alimentos: resultados da consulta por processo passam a se reorganizar em uma coluna no iPhone, com rótulos e valores dentro da tela, quebra segura de textos longos e apresentações responsivas.'
          vp.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          node .v17fix/codec.js d .v17fix/alimentos.new.b64 .v17fix/alimentos.check.html
          grep -q 'grid-template-columns:minmax(0,1fr)' .v17fix/alimentos.check.html
          grep -q 'overflow-wrap:anywhere' .v17fix/alimentos.check.html
          grep -q '20260907-17' index.html
          grep -q "const VERSAO = '20260907-17'" sw.js
          grep -q '"versao": "20260907-17"' versao.json
          python - <<'PY'
          from pathlib import Path
          import re
          a=Path('.v17fix/index.before.html').read_text(); b=Path('index.html').read_text()
          def blocks(s): return dict(re.findall(r'<script type="text/plain" id="([^"]+)">(.*?)</script>',s,re.S))
          x,y=blocks(a),blocks(b)
          if len(x)!=36 or len(y)!=36: raise SystemExit(f'packed block count mismatch {len(x)} {len(y)}')
          changed=[k for k in x if x[k]!=y[k]]
          print('changed packed blocks:',changed)
          if changed!=['app--alimentos-integrado']: raise SystemExit('unexpected packed modules changed: '+repr(changed))
          PY
          rm -rf .github _v17-probe.txt _v17-diag.txt _v17-alimentos-target.txt .v17diag .v17target
          git add -A
          echo 'Changed vs main:'
          git diff --cached --name-only origin/main
          test "$(git diff --cached --name-only origin/main | sort | tr '\n' ' ')" = "index.html sw.js versao.json "
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix Alimentos mobile process lookup 20260907-17'
          git push origin HEAD:publish-v17-staging
