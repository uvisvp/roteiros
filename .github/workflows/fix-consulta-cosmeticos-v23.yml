name: Fix consulta cosmeticos v23

on:
  push:
    branches: [fix-consulta-cosmeticos-v23]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-consulta-cosmeticos-v23
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Patch consulta por processo de cosmeticos
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'index.html';
          let html = fs.readFileSync(path, 'utf8');

          function replaceOnce(source, target, label) {
            const count = html.split(source).length - 1;
            if (count !== 1) throw new Error(label + ': esperado 1, encontrado ' + count);
            html = html.replace(source, target);
          }

          replaceOnce('v20260908-22 JS desligado', 'v20260908-23 JS desligado', 'versao da casca');
          replaceOnce("const APP_VERSAO = '20260908-22';", "const APP_VERSAO = '20260908-23';", 'APP_VERSAO');

          const anchor = "  function montar(app){\n    var s = rec('app--' + app);\n";
          const bridge = String.raw`    /* Complemento de segurança da Central: a base de cosméticos é fragmentada
             pelos dígitos 6–8 do processo. Se um índice antigo ainda não trouxer a
             referência, consulta diretamente o fragmento correto e só acrescenta o
             cartão quando a busca normal não tiver retornado cadastro algum. */
          if(app==='central-consultas'){
            var ponte=['<scr','ipt>',String.raw\`(function(){
              var BASE='https://uvisvp.github.io/base-vigilancia/dados/cosmeticos/';
              function dig(v){return String(v||'').replace(/\\D/g,'');}
              function esc(v){return String(v||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
              function processoAtivo(){var b=document.querySelector('.mode.on');return !!(b&&b.getAttribute('data-mode')==='processo');}
              function inserir(lista,processo){setTimeout(function(){
                var atual=dig(document.getElementById('q')&&document.getElementById('q').value);
                var host=document.getElementById('results');
                if(atual!==processo||!host||host.querySelector('.result,[data-uvis-cosmetico-processo]'))return;
                var itens=lista.filter(function(x){return dig(x&&x.processo)===processo;});
                if(!itens.length)return;
                var html='<div class="summary"><div class="sum"><b>'+itens.length+'</b><span>cadastros e autorizações</span></div><div class="sum"><b>0</b><span>alertas relacionados</span></div><div class="sum"><b>0</b><span>medidas fiscais relacionadas</span></div></div><div class="group"><div class="grouphead"><h3>Cadastro regulatório e autorizações</h3><span>'+itens.length+' resultado(s)</span></div><details class="sub-base" open><summary>Cosméticos <span class="tag">'+itens.length+'</span></summary><div class="sub-body">'+itens.map(function(x){return '<article class="result" data-uvis-cosmetico-processo><h4>'+esc(x.produto||'Cosmético')+'</h4><div class="kv"><b>Processo</b><span>'+esc(x.processo)+'</span><b>CNPJ</b><span>'+esc(x.cnpj)+'</span><b>Detentor</b><span>'+esc(x.detentor)+'</span><b>Situação</b><span>'+esc(x.situacao)+'</span><b>Tipo</b><span>'+esc(x.tipo)+'</span></div></article>';}).join('')+'</div></details></div>';
                host.className='';host.innerHTML=html;
                var st=document.getElementById('status');if(st){st.className='status ok';st.textContent='Consulta concluída. Cadastro de cosmético localizado pelo processo Anvisa.';}
              },900);}
              function complementar(){if(!processoAtivo())return;var processo=dig(document.getElementById('q')&&document.getElementById('q').value);if(processo.length<13)return;var fragmento=processo.slice(5,8);if(!fragmento)return;
                fetch(BASE+fragmento+'.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():[];}).then(function(d){inserir(Array.isArray(d)?d:[],processo);}).catch(function(){});}
              document.addEventListener('click',function(e){if(e.target.closest('#search'))complementar();},true);
              document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target&&e.target.id==='q')complementar();},true);
            })();\`,'</scr','ipt>'].join('');
            s=s.replace(/<\/body>/i,ponte+'</body>');
          }
          `;

          const anchorCount = html.split(anchor).length - 1;
          if (anchorCount !== 1) throw new Error('ponto de montagem: esperado 1, encontrado ' + anchorCount);
          html = html.replace(anchor, anchor + bridge);
          if (!html.includes('data-uvis-cosmetico-processo')) throw new Error('ponte não foi inserida');
          fs.writeFileSync(path, html);
          NODE

          python <<'PY'
          import json
          from pathlib import Path

          path = Path('versao.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['versao'] == '20260908-22', data
          data.update({
              'versao': '20260908-23',
              'correcoes': 7,
              'notas': 'Central de Consultas: consulta por processo agora tem confirmação direta no fragmento de Cosméticos, sem alterar as demais bases.'
          })
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          path = Path('sw.js')
          source = path.read_text(encoding='utf-8')
          old = "const VERSAO = '20260908-22';"
          assert source.count(old) == 1
          path.write_text(source.replace(old, "const VERSAO = '20260908-23';"), encoding='utf-8')
          PY

      - name: Validate patch and real cosmetic process
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('index.html', 'utf8');
          for (const expected of ["v20260908-23 JS desligado", "const APP_VERSAO = '20260908-23';", 'data-uvis-cosmetico-processo']) {
            if (!html.includes(expected)) throw new Error('ausente: ' + expected);
          }
          const outer = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].at(-1);
          if (!outer) throw new Error('script externo não localizado');
          new vm.Script(outer[1]);
          NODE

          python <<'PY'
          import json
          import re
          import urllib.request

          process = re.sub(r'\D', '', '25351250640201090')
          fragment = process[5:8]
          url = f'https://uvisvp.github.io/base-vigilancia/dados/cosmeticos/{fragment}.json?check=20260908'
          with urllib.request.urlopen(url, timeout=60) as response:
              data = json.load(response)
          hits = [item for item in data if re.sub(r'\D', '', str(item.get('processo', ''))) == process]
          assert hits, 'processo cosmético real não localizado no fragmento'
          assert 'SHAMPOO FRUIT THERAPY' in hits[0].get('produto', '')
          print('TEST OK:', hits[0]['produto'])
          PY

      - name: Commit clean result
        run: |
          rm .github/workflows/fix-consulta-cosmeticos-v23.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Corrige consulta de cosméticos por processo 20260908-23'
          git push origin fix-consulta-cosmeticos-v23
