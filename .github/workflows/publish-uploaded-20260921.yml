name: Publicar HTML enviado 20260921

on:
  push:
    branches: [main]
    paths:
      - '.publish_tmp_20260921/READY'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruir HTML enviado
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re

          V='20260921-1'
          d=Path('.publish_tmp_20260921')
          parts=[d/f'part{i:02d}.txt' for i in range(1,10)]
          missing=[str(p) for p in parts if not p.exists()]
          if missing:
              raise SystemExit('Partes ausentes: '+', '.join(missing))

          html='\n'.join(p.read_text(encoding='utf-8') for p in parts)
          html,n=re.subn(r"const APP_VERSAO\s*=\s*['\"][^'\"]+['\"]",f"const APP_VERSAO = '{V}'",html,count=1)
          if n != 1:
              raise SystemExit('APP_VERSAO não localizado uma única vez')
          if len(html) < 5_000_000:
              raise SystemExit(f'HTML reconstruído parece incompleto: {len(html)} bytes/chars')
          if '<!doctype html>' not in html.lower() or '</html>' not in html.lower():
              raise SystemExit('HTML reconstruído inválido/incompleto')

          Path('index.html').write_text(html,encoding='utf-8')
          Path('Index.html').write_text(html,encoding='utf-8')

          sp=Path('sw.js')
          sw=sp.read_text(encoding='utf-8')
          sw,n=re.subn(r"const VERSAO\s*=\s*['\"][^'\"]+['\"]",f"const VERSAO = '{V}'",sw,count=1)
          if n != 1:
              raise SystemExit('VERSAO do sw.js não localizada')
          sp.write_text(sw,encoding='utf-8')

          vp=Path('versao.json')
          data=json.loads(vp.read_text(encoding='utf-8'))
          data['versao']=V
          data['notas']='Publicação do HTML enviado pelo usuário em 21/09/2026.'
          vp.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          print('HTML chars:',len(html))
          print('Versão:',V)
          PY

      - name: Validar
        run: |
          V=$(python -c "import json;print(json.load(open('versao.json'))['versao'])")
          grep -q "const APP_VERSAO = '$V'" index.html
          grep -q "const VERSAO = '$V'" sw.js
          cmp -s index.html Index.html
          node --check sw.js

      - name: Publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html Index.html sw.js versao.json
          git commit -m "publish: PWA 20260921-1 — HTML enviado pelo usuário"
          git pull --rebase origin main
          git push origin HEAD:main
