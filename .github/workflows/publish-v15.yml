name: Build v15 staging

on:
  push:
    branches: [publish-v15-staging]
    paths:
      - '.github/workflows/publish-v15.yml'

permissions:
  contents: write

jobs:
  build-v15:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish-v15-staging
          fetch-depth: 0

      - name: Rebuild exact v15 package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .rebuild-v15/tmp

          cat _publish15/drogaria.part* | base64 -d | gzip -d > .rebuild-v15/drogaria.patch
          cat _publish15/produtos.part* | base64 -d | gzip -d > .rebuild-v15/produtos.src
          for n in shell distribuidora manipulacao roteiro; do
            base64 -d < "_publish15/$n.patch.gz.b64" | gzip -d > ".rebuild-v15/$n.patch"
          done

          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html').read_text()
          blocks={}
          out=[]
          for line in p.splitlines(True):
              m=re.match(r'<script type="text/plain" id="([^"]+)">(.*)</script>\s*$', line, re.S)
              if m:
                  blocks[m.group(1)]=m.group(2)
                  out.append(f'@@BLOCK:{m.group(1)}@@\n')
              else:
                  out.append(line)
          if len(blocks) != 36:
              raise SystemExit(f'expected 36 packed blocks, got {len(blocks)}')
          Path('.rebuild-v15/index.shell').write_text(''.join(out))
          for k,v in blocks.items():
              Path('.rebuild-v15/tmp/'+k.replace('/','_')+'.b64').write_text(v)
          PY

          patch --batch .rebuild-v15/index.shell < .rebuild-v15/shell.patch >/dev/null

          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html').read_text()
          m=re.search(r'<script[^>]+id="lz-core"[^>]*>(.*?)</script>',p,re.S)
          if not m:
              raise SystemExit('lz-core missing')
          Path('.rebuild-v15/lz-core.js').write_text(m.group(1)+'\nmodule.exports=LZString;\n')
          PY

          cat > .rebuild-v15/codec.js <<'JS'
          const fs=require('fs');
          const LZString=require('./lz-core.js');
          const [,,mode,input,output]=process.argv;
          if(mode==='d') fs.writeFileSync(output,LZString.decompressFromBase64(fs.readFileSync(input,'utf8').trim()));
          else if(mode==='c') fs.writeFileSync(output,LZString.compressToBase64(fs.readFileSync(input,'utf8')));
          else throw Error('mode');
          JS

          for id in app--drogaria app--farmacia-manipulacao app--distribuidoras-transportadoras rec--roteiro-guiado.js app--produtos-correlatos; do
            node .rebuild-v15/codec.js d ".rebuild-v15/tmp/${id}.b64" ".rebuild-v15/tmp/${id}.src"
            python -c "from pathlib import Path; p=Path('.rebuild-v15/tmp/${id}.src'); p.write_bytes(p.read_bytes().replace(b'\\r\\n',b'\\n').replace(b'\\r',b'\\n'))"
          done

          patch --batch .rebuild-v15/tmp/app--drogaria.src < .rebuild-v15/drogaria.patch >/dev/null
          patch --batch .rebuild-v15/tmp/app--farmacia-manipulacao.src < .rebuild-v15/manipulacao.patch >/dev/null
          patch --batch .rebuild-v15/tmp/app--distribuidoras-transportadoras.src < .rebuild-v15/distribuidora.patch >/dev/null
          patch --batch .rebuild-v15/tmp/rec--roteiro-guiado.js.src < .rebuild-v15/roteiro.patch >/dev/null
          cp .rebuild-v15/produtos.src .rebuild-v15/tmp/app--produtos-correlatos.src

          for id in app--drogaria app--farmacia-manipulacao app--distribuidoras-transportadoras app--produtos-correlatos rec--roteiro-guiado.js; do
            node .rebuild-v15/codec.js c ".rebuild-v15/tmp/${id}.src" ".rebuild-v15/tmp/${id}.b64"
          done

          python - <<'PY'
          from pathlib import Path
          import re
          shell=Path('.rebuild-v15/index.shell').read_text()
          def repl(m):
              i=m.group(1)
              p=Path('.rebuild-v15/tmp/'+i.replace('/','_')+'.b64')
              if not p.exists():
                  raise SystemExit('missing block '+i)
              return '<script type="text/plain" id="'+i+'">'+p.read_text().strip()+'</script>'
          final=re.sub(r'@@BLOCK:([^@\n]+)@@', repl, shell)
          Path('index.html').write_text(final)
          Path('sw.js').write_text(Path('_publish15/sw.js').read_text())
          Path('versao.json').write_text(Path('_publish15/versao.json').read_text())
          PY

          echo '60f8483a0c1d1ae41ff432f59aceb1702259ce28b38e897a40177e0d89454d55  index.html' | sha256sum -c -
          echo 'e19f47fdd388fa54957ffd95fa5e688351f1789690464eed117ad6b85050b923  sw.js' | sha256sum -c -
          echo 'd17216c0562ed5d749fdcab5dbd7e68e1048ce79383573f9935e7003b5ef06cd  versao.json' | sha256sum -c -
          grep -q '20260907-15' index.html
          grep -q "const VERSAO = '20260907-15'" sw.js
          grep -q '"versao": "20260907-15"' versao.json

      - name: Commit clean validated v15
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _publish15 .rebuild-v15 .publish-v15-action-ok
          rm -f .github/workflows/publish-v15.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish inspection app 20260907-15'
          git push origin HEAD:publish-v15-staging
