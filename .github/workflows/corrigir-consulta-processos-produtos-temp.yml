name: Corrigir consulta de produtos por processo - temporario

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/corrigir-consulta-processos-produtos-temp.yml'

permissions:
  contents: write

jobs:
  corrigir:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar consulta completa por processo
        run: python scripts/patch-consulta-processos.py
      - name: Validar JavaScript
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]);
          const shell=scripts.find(x=>x.includes('function montar(app)'));
          if(!shell)throw Error('casca nao localizada');
          new vm.Script(shell);
          for(const x of ['saneantes_processos','medicamentos_processos','cosmeticos','data-uvis-processo-complementar',"const APP_VERSAO = '20260911-28';"]){if(!html.includes(x))throw Error('ausente: '+x);}
          console.log('JavaScript da casca validado.');
          NODE
      - name: Validar processo real de saneante
        run: |
          python <<'PY'
          import json,re,time,urllib.request
          alvo='25351239002201018'
          url='https://raw.githubusercontent.com/uvisvp/base-vigilancia/main/dados/saneantes_processos/239.json'
          ultimo=None
          for _ in range(60):
              try:
                  with urllib.request.urlopen(url+'?v='+str(time.time()),timeout=30) as r:
                      data=json.load(r)
                  hits=[x for x in data if re.sub(r'\D','',str(x.get('processo','')))==alvo]
                  if hits:
                      assert 'HTH LIMPA BORDAS' in hits[0].get('produto','').upper(), hits[0]
                      print('TESTE REAL OK:',hits[0])
                      break
              except Exception as e:
                  ultimo=e
              time.sleep(5)
          else:
              raise RuntimeError(f'base saneantes por processo ainda indisponivel: {ultimo}')
          PY
      - name: Publicar versao limpa
        run: |
          rm -f .github/workflows/diagnosticar-consulta-produtos-temp.yml
          rm -f .github/workflows/corrigir-consulta-processos-produtos-temp.yml
          rm -f scripts/patch-consulta-processos.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Amplia consulta por processo para saneantes e medicamentos'
          git pull --rebase origin main
          git push origin HEAD:main
