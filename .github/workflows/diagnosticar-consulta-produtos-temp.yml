name: Diagnosticar consulta por processo - temporario
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnosticar-consulta-produtos-temp.yml'
permissions:
  contents: read
jobs:
  diagnosticar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Localizar ponte e resolvedor
        run: |
          python <<'PY'
          from pathlib import Path
          for name in ['index.html','Index.html']:
              p=Path(name)
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8',errors='replace')
              print('\n###',name,'bytes',len(s))
              for needle in ['data-uvis-cosmetico-processo','indices/processos','dados/cosmeticos/','function montar(app)']:
                  i=s.find(needle)
                  print('\nNEEDLE',needle,'AT',i)
                  if i>=0: print(s[max(0,i-1800):i+3600])
          PY
