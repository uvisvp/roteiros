name: Publicar correção IFA e paleta

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-ifa-versao-temp.yml'
      - 'scripts/publicar_ifa_cores.py'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Aplicar correções
        run: python scripts/publicar_ifa_cores.py

      - name: Validar
        run: |
          node --check sw.js
          node --check ifa-lookup-shared.js
          grep -q "const APP_VERSAO = '20260913-10'" index.html
          grep -q "const VERSAO = '20260913-10'" sw.js
          grep -q "uvis-publish-vivid-20260913" index.html
          grep -q "mode='ifa'" index.html
          grep -q "ifa/registros.json" index.html
          cmp -s index.html Index.html

      - name: Publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html Index.html sw.js versao.json
          if git diff --cached --quiet; then
            echo 'Publicação já aplicada; nada novo para commitar.'
            exit 0
          fi
          git commit -m 'fix: corrige consulta IFA e reforça paleta visual'
          git pull --rebase origin main
          git push origin HEAD:main
