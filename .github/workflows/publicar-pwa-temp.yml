# execução imediata 2026-09-11
name: Publicar PWA atualizado

on:
  push:
    paths:
      - '.github/workflows/publicar-pwa-temp.yml'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Atualizar versão e cache do PWA
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          NOVA = '20260911-29'

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          html2, n = re.subn(
              r"const APP_VERSAO\s*=\s*['\"][^'\"]+['\"]\s*;",
              f"const APP_VERSAO = '{NOVA}';",
              html,
              count=1,
          )
          if n != 1:
              raise SystemExit('APP_VERSAO não localizado de forma única no index.html')
          p.write_text(html2, encoding='utf-8')

          p = Path('sw.js')
          sw = p.read_text(encoding='utf-8')
          sw2, n = re.subn(
              r"const VERSAO\s*=\s*['\"][^'\"]+['\"]\s*;",
              f"const VERSAO = '{NOVA}';",
              sw,
              count=1,
          )
          if n != 1:
              raise SystemExit('VERSAO não localizada de forma única no sw.js')

          essenciais = [
              './drogaria-section1.js',
              './drogaria-area-fisica.js',
              './drogaria-servicos-documentos.js',
              './drogaria-review.js',
              './drogaria-ocr-tools.js',
              './drogaria-report-final.js',
              './drogaria-final-bridge.js',
          ]
          marcador = "  './index.html',\n"
          if marcador not in sw2:
              raise SystemExit('Lista ESSENCIAIS não localizada no sw.js')
          for arq in essenciais:
              if arq not in sw2:
                  sw2 = sw2.replace(marcador, marcador + f"  '{arq}',\n", 1)
          p.write_text(sw2, encoding='utf-8')

          p = Path('versao.json')
          dados = json.loads(p.read_text(encoding='utf-8'))
          dados['versao'] = NOVA
          dados['correcoes'] = int(dados.get('correcoes', 0)) + 1
          dados['notas'] = (
              'PWA atualizada para incorporar a última revisão de Drogaria e forçar '
              'renovação do cache instalado; módulos de Drogaria passam a integrar '
              'o cache essencial. Mantida a ampliação das consultas por processo '
              'de saneantes e medicamentos.'
          )
          p.write_text(json.dumps(dados, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          print('Versão preparada:', NOVA)
          PY

      - name: Validar consistência da versão
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          nova = '20260911-29'
          html = Path('index.html').read_text(encoding='utf-8')
          sw = Path('sw.js').read_text(encoding='utf-8')
          v = json.loads(Path('versao.json').read_text(encoding='utf-8'))
          assert re.search(r"const APP_VERSAO\s*=\s*['\"]20260911-29['\"]", html)
          assert "const VERSAO = '20260911-29';" in sw
          assert v['versao'] == nova
          for arq in [
              'drogaria-section1.js','drogaria-area-fisica.js',
              'drogaria-servicos-documentos.js','drogaria-review.js',
              'drogaria-ocr-tools.js','drogaria-report-final.js',
              'drogaria-final-bridge.js'
          ]:
              assert f"'./{arq}'" in sw, arq
          print('PASS: index, service worker e versao.json sincronizados')
          PY

      - name: Testar PWA e Drogaria
        run: |
          node scripts/test-pwa-scope.cjs
          node scripts/test-pwa-update.cjs
          node scripts/test-drogaria.cjs

      - name: Publicar versão PWA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js versao.json
          git rm .github/workflows/publicar-pwa-temp.yml
          git commit -m "Publica PWA 20260911-29 com revisão de Drogaria"
          git push origin HEAD:main
