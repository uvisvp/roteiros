name: Diagnosticar dados oficiais de IFA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnosticar-ifa-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baixar fontes oficiais Anvisa e mostrar esquema
        shell: bash
        run: |
          set -euo pipefail
          base='https://dados.anvisa.gov.br/dados'
          for f in 'TA_FABRICANTE_MEDICAMENTO_IFA.CSV' 'TA_EXPORT_IFA.csv' 'CICLO_ANALISE_PETICOES_INSUMO_FARMACEUTICO.CSV' 'CICLO_ANALISE_PETICOES_ANDAMENTO_INSUMO_FARMACEUTICO.CSV'; do
            echo "===== $f ====="
            curl -L --fail --retry 4 --retry-delay 2 --connect-timeout 20 "$base/$f" -o "/tmp/$f"
            ls -lh "/tmp/$f"
            FILE="/tmp/$f" python - <<'PY'
          import csv, os
          from pathlib import Path
          p=Path(os.environ['FILE'])
          raw=p.read_bytes()
          enc=None
          for e in ('utf-8-sig','utf-8','latin-1','cp1252'):
              try:
                  txt=raw.decode(e); enc=e; break
              except UnicodeDecodeError: pass
          print('encoding=', enc)
          sample=txt[:100000]
          try:
              dialect=csv.Sniffer().sniff(sample, delimiters=';,|\t,')
              delim=dialect.delimiter
          except Exception:
              delim=';'
          print('delimiter=',repr(delim))
          rows=csv.reader(txt.splitlines(), delimiter=delim)
          for i,row in enumerate(rows):
              print('ROW', i, row)
              if i>=3: break
          PY
          done
      - name: Extrair dicionários oficiais
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pypdf
          base='https://dados.anvisa.gov.br/dados'
          for f in 'Documentacao_e_Dicionario_de_Dados_Fabricantes_IFA.pdf' 'Documentacao_e_Dicionario_de_Dados_INSUMO_FARMACEUTICO.pdf'; do
            echo "===== $f ====="
            curl -L --fail --retry 4 --retry-delay 2 --connect-timeout 20 "$base/$f" -o "/tmp/$f"
            FILE="/tmp/$f" python - <<'PY'
          import os
          from pypdf import PdfReader
          p=os.environ['FILE']
          r=PdfReader(p)
          print('pages=',len(r.pages))
          text='\n'.join((pg.extract_text() or '') for pg in r.pages)
          print(text[:20000])
          PY
          done
